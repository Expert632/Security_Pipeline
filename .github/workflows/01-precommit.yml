name: 03 - IaC OPA Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  iac-opa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OPA and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opa

      - name: Run OPA policy checks
        run: |
          opa test policies/ tests/ || true

      - name: Upload OPA scan results to DefectDojo
        uses: portswigger-cloud/defectdojo-import-scan@v1
        with:
          dojo_url: ${{ secrets.DEFECTDOJO_URL }}
          api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
          engagement: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
          product: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}
          scan_type: "OPA Scan"
          file: opa-results.sarif

      - name: Gate: fail if critical policies violated
        id: gate
        run: |
          python3 - <<'PY'
import json, sys
f='opa-results.sarif'
data=json.load(open(f))
crit=0
for r in data.get('runs', []):
    for r2 in r.get('results', []):
        if r2.get('level','').lower() in ('error','critical'):
            crit += 1
if crit > 0:
    print("CRITICAL findings:", crit)
    sys.exit(1)
print("No criticals")
PY
